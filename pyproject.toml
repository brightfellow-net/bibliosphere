[project]
name = "bibliosphere"
version = "0.1.0"
description = "Desktop library management system"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
